# Deploy on Render.com (free tier): New + -> Blueprint -> pick this repository.
# Add LLM_API_KEY in the Render dashboard (never in this file) to enable AI.
services:
  - type: web
    name: automata-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 2 workers x 4 threads: one slow request no longer blocks every visitor.
    # 120 s timeout: room for an AI answer (up to 3 tries of 30 s for NL -> regex).
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Gemini has a FREE key (https://aistudio.google.com/apikey), so visitors
      # of the public link cannot run up a bill on a paid key.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      # AI requests allowed per visitor per minute.
      - key: AI_REQUESTS_PER_MINUTE
        value: "10"
