# Deploy on Render.com (free tier): New + -> Blueprint -> pick this repository.
# Add LLM_API_KEY in the Render dashboard (never in this file) to enable AI.
services:
  - type: web
    name: automata-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
